<title>Double KPI 予実</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: summary strip → category gauges + monthly funnel → filterable roster. Ink-on-paper palette, ink-blue accent, signal colors reserved for attainment. */
:root{
  --bg:#f6f5f1;--surface:#ffffff;--fg:#1c1d22;--muted:#6b6e78;--line:#dcdbd4;
  --accent:#1f4e9b;--accent-soft:#e3ebf7;
  --good:#1f7a4d;--good-soft:#dff1e6;--warn:#b86a00;--warn-soft:#fbead1;--bad:#b3261e;--bad-soft:#f8dfdd;
  --track:#e9e8e2;
  --display:"IBM Plex Sans JP",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--surface:#1f2026;--fg:#ecebe6;--muted:#9a9ca6;--line:#33353d;--accent:#7fa7e6;--accent-soft:#23324c;--good:#5fbf8a;--good-soft:#1e3a2b;--warn:#e3a24a;--warn-soft:#3d2d14;--bad:#ea7b74;--bad-soft:#44211f;--track:#2a2b32;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15161a;--surface:#1f2026;--fg:#ecebe6;--muted:#9a9ca6;--line:#33353d;--accent:#7fa7e6;--accent-soft:#23324c;--good:#5fbf8a;--good-soft:#1e3a2b;--warn:#e3a24a;--warn-soft:#3d2d14;--bad:#ea7b74;--bad-soft:#44211f;--track:#2a2b32;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:14px;line-height:1.5;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:28px 56px;display:grid;gap:28px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--fg);padding-bottom:14px}
h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em}
h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.meta{font-size:12px;color:var(--muted);font-family:var(--mono)}
.meta a{color:var(--accent)}
h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);padding:16px 18px;min-width:0}
.tile .l{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--mono);font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
.tile .v span{font-size:14px;color:var(--muted);margin-left:4px;font-family:var(--display)}
.tile .s{font-size:12px;margin-top:8px;color:var(--muted)}
.bar{height:6px;background:var(--track);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:28px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);padding:18px 20px;min-width:0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-family:var(--mono);font-size:13px}
.cat td:first-child{font-weight:500}
.gauge{display:flex;align-items:center;gap:10px;min-width:160px}
.gauge .t{flex:1;height:10px;background:var(--track);position:relative}
.gauge .t i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.gauge .t b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.5}
.pill{display:inline-block;padding:2px 8px;font-size:11px;font-weight:600;border-radius:999px;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-acc{background:var(--accent-soft);color:var(--accent)}.p-mut{background:var(--track);color:var(--muted)}
.scroll{overflow-x:auto}
svg text{fill:var(--fg);font-family:var(--mono);font-size:11px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:middle}
.funnel{display:grid;gap:6px;margin-top:4px}
.funnel div{display:grid;grid-template-columns:150px 1fr 56px;align-items:center;gap:10px;font-size:13px}
.funnel .fb{height:16px;background:var(--track)}.funnel .fb i{display:block;height:100%;background:var(--accent)}
.funnel .n{font-family:var(--mono);text-align:right}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{font:inherit;padding:7px 10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);min-width:0}
.toolbar input{flex:1 1 200px}
.count{font-size:12px;color:var(--muted);margin-left:auto;font-family:var(--mono)}
.roster td a{color:var(--accent);text-decoration:none}
.roster td a:hover{text-decoration:underline}
.roster td.name{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.analogy{border-left:3px solid var(--accent);padding:10px 14px;background:var(--accent-soft);font-size:13px}
button.more{font:inherit;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;margin-top:10px}
button.more:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
th button{all:unset;cursor:pointer}
@media(prefers-reduced-motion:no-preference){.bar i,.gauge .t i{transition:width .5s ease}}
</style>
